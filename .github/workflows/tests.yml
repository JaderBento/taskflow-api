name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sua_senha
          POSTGRES_DB: TaskFlow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h localhost -U postgres -d TaskFlow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aguardar PostgreSQL
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do
            echo "Aguardando PostgreSQL..."
            sleep 2
          done

      - name: Criar tabela
        run: |
          PGPASSWORD=sua_senha psql -h 127.0.0.1 -U postgres -d TaskFlow -c "CREATE TABLE IF NOT EXISTS tarefas (id SERIAL PRIMARY KEY, titulo VARCHAR(255) NOT NULL, concluida BOOLEAN DEFAULT FALSE);"

      - name: Rodar testes
        run: |
          pytest