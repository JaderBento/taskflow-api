services:
  db:
    image: postgres:16
    container_name: taskflow_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sua_senha
      POSTGRES_DB: TaskFlow
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d TaskFlow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: taskflow_api
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: TaskFlow
      DB_USER: postgres
      DB_PASSWORD: sua_senha
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy